<!doctype html>
<html lang="pt-br" data-bs-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Ollama Web Platform{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <div class="brand mb-4">
            <div class="brand-mark"><i class="bi bi-cpu"></i></div>
            <div>
                <div class="brand-title">Ollama Web</div>
                <div class="brand-subtitle">Busca + IA local</div>
            </div>
        </div>

        <nav class="nav flex-column gap-2">
            <a class="nav-link {% if request.endpoint == 'index' %}active{% endif %}" href="{{ url_for('index') }}">
                <i class="bi bi-search"></i> Pesquisar
            </a>
            <a class="nav-link {% if request.endpoint == 'status' %}active{% endif %}" href="{{ url_for('status') }}">
                <i class="bi bi-graph-up-arrow"></i> Status
            </a>
            <a class="nav-link {% if request.endpoint == 'settings' %}active{% endif %}" href="{{ url_for('settings') }}">
                <i class="bi bi-sliders"></i> Configurações
            </a>
            <a class="nav-link {% if request.endpoint in ['history', 'history_detail'] %}active{% endif %}" href="{{ url_for('history') }}">
                <i class="bi bi-clock-history"></i> Histórico
            </a>
        </nav>

        <div class="sidebar-footer">
            <div class="mini-hint">
                <i class="bi bi-shield-check"></i>
                Uso local em <strong>127.0.0.1</strong>. Branco, limpo e sem maionese bege.
            </div>
        </div>
    </aside>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
